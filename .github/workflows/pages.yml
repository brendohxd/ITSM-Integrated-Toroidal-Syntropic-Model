# Manual Actions deploy for the public site. Dispatch this workflow from
# recovery/v12-core-architecture; the selected ref's /docs tree is uploaded.
# GitHub's Pages API can retain legacy gh-pages source metadata even though the
# deployed artifact is supplied by actions/deploy-pages.

name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
