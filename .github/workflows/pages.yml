# Manual Actions deploy for the public site. Dispatch this workflow from
# recovery/v12-core-architecture; the selected ref's /docs tree is uploaded.
# GitHub's Pages API can retain legacy gh-pages source metadata even though the
# deployed artifact is supplied by actions/deploy-pages.

name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only the linked evidence snapshots
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          prefix = r'https://github\.com/brendohxd/ITSM-Integrated-Toroidal-Syntropic-Model/blob/([a-f0-9]{40})/'
          revisions = sorted({revision for page in Path('docs').glob('*.html')
                              for revision in re.findall(prefix, page.read_text(encoding='utf-8'))})
          if revisions:
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *revisions], check=True)
          PY
      - name: Check website structure and current paper versions
        run: |
          python3 -B -m unittest discover -s Scripts/site -p 'test_*.py'
          python3 -B Scripts/site/check_public_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
