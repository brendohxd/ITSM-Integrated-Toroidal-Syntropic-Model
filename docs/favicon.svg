<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    
    <!-- Torus Glow Filters -->
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear & Radial Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#d4b06a" />
      <stop offset="100%" stop-color="#99732e" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Outer Faint Glow Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" stroke-dasharray="6,4" />

  <!-- Outer Toroidal Chiral Swirls (Cyan) -->
  <g filter="url(#glow-cyan)" opacity="0.9">
    <ellipse cx="64" cy="64" rx="46" ry="32" fill="none" stroke="url(#cyan-grad)" stroke-width="2.2" transform="rotate(-30 64 64)" />
    <ellipse cx="64" cy="64" rx="46" ry="32" fill="none" stroke="url(#cyan-grad)" stroke-width="2.2" transform="rotate(30 64 64)" />
    <ellipse cx="64" cy="64" rx="46" ry="32" fill="none" stroke="url(#cyan-grad)" stroke-width="2.2" transform="rotate(90 64 64)" />
  </g>

  <!-- Inner High-Energy Toroidal Circulation (Gold) -->
  <g filter="url(#glow-gold)">
    <circle cx="64" cy="64" r="30" fill="none" stroke="url(#gold-grad)" stroke-width="3" />
    <ellipse cx="64" cy="64" rx="32" ry="18" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" transform="rotate(-45 64 64)" />
    <ellipse cx="64" cy="64" rx="32" ry="18" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" transform="rotate(45 64 64)" />
  </g>

  <!-- Core Vortex Throat -->
  <circle cx="64" cy="64" r="12" fill="#050811" stroke="#ffe699" stroke-width="1.8" filter="url(#glow-gold)" />
  <circle cx="64" cy="64" r="3.5" fill="#38bdf8" filter="url(#glow-cyan)" />
</svg>