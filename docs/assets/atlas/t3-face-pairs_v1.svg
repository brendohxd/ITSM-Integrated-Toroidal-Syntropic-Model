<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>T3 face-pair coordinate guide</title><desc>Three pairs of opposite faces are identified independently with no reversal of the other coordinates. Time is not included among these spatial identifications.</desc><rect width="1000" height="660" fill="#0a141c"/><text x="56" y="65" fill="#eef1e9" font-family="Georgia,serif" font-size="36">Three directions. Three identifications.</text><text x="56" y="101" fill="#a7bbc5" font-family="Arial,sans-serif" font-size="16">A coordinate guide to T3 = S1 x S1 x S1</text><rect x="56" y="151" width="888" height="118" rx="5" fill="#111f29" stroke="#29424e"/><rect x="56" y="151" width="4" height="118" fill="#72d7cd"/><text x="82" y="193" fill="#72d7cd" font-family="Arial,sans-serif" font-size="18">X PAIR</text><text x="265" y="194" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(0, y, z)</text><path d="M 484 185 H 561 m -8 -6 8 6 -8 6 M 561 199 H 484 m 8 -6 -8 6 8 6" stroke="#72d7cd" stroke-width="2" fill="none"/><text x="600" y="194" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(Lx, y, z)</text><text x="265" y="234" fill="#a7bbc5" font-family="Arial,sans-serif" font-size="15">Keep y and z unchanged.</text><rect x="56" y="293" width="888" height="118" rx="5" fill="#111f29" stroke="#29424e"/><rect x="56" y="293" width="4" height="118" fill="#e6ba7b"/><text x="82" y="335" fill="#e6ba7b" font-family="Arial,sans-serif" font-size="18">Y PAIR</text><text x="265" y="336" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(x, 0, z)</text><path d="M 484 327 H 561 m -8 -6 8 6 -8 6 M 561 341 H 484 m 8 -6 -8 6 8 6" stroke="#e6ba7b" stroke-width="2" fill="none"/><text x="600" y="336" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(x, Ly, z)</text><text x="265" y="376" fill="#a7bbc5" font-family="Arial,sans-serif" font-size="15">Keep x and z unchanged.</text><rect x="56" y="435" width="888" height="118" rx="5" fill="#111f29" stroke="#29424e"/><rect x="56" y="435" width="4" height="118" fill="#b7a0eb"/><text x="82" y="477" fill="#b7a0eb" font-family="Arial,sans-serif" font-size="18">Z PAIR</text><text x="265" y="478" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(x, y, 0)</text><path d="M 484 469 H 561 m -8 -6 8 6 -8 6 M 561 483 H 484 m 8 -6 -8 6 8 6" stroke="#b7a0eb" stroke-width="2" fill="none"/><text x="600" y="478" fill="#eef1e9" font-family="Arial,sans-serif" font-size="23">(x, y, Lz)</text><text x="265" y="518" fill="#a7bbc5" font-family="Arial,sans-serif" font-size="15">Keep x and y unchanged.</text><text x="56" y="617" fill="#a7bbc5" font-family="Arial,sans-serif" font-size="14">Opposite faces are identified by translations. No physical wall is introduced.</text><text x="56" y="642" fill="#7f97a5" font-family="Arial,sans-serif" font-size="12">The rectangular chart is illustrative; topology does not select Lx, Ly, Lz or the local metric.</text></svg>