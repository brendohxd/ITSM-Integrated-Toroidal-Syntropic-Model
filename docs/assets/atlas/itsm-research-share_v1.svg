<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>ITSM research identity</title><desc>A schematic three-dimensional periodic cell accompanies the ITSM research proposal. It is not a donut-shaped universe or a physical simulation.</desc><rect width="1200" height="630" fill="#0a141c"/><path d="M 64 88 H 1136 M 64 557 H 1136" stroke="#29424e"/><text x="64" y="64" fill="#72d7cd" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">ITSM / COSMOLOGY RESEARCH</text><text x="64" y="225" fill="#f2f0e6" font-family="Georgia,serif" font-size="58">An active vacuum.</text><text x="64" y="295" fill="#e6ba7b" font-family="Georgia,serif" font-size="58">A connected universe.</text><text x="64" y="367" fill="#becdd3" font-family="Arial,sans-serif" font-size="20">Finite-density vacuum. Three periodic directions.</text><text x="64" y="404" fill="#becdd3" font-family="Arial,sans-serif" font-size="20">A programme of physical tests.</text><text x="64" y="526" fill="#93a9b6" font-family="Arial,sans-serif" font-size="15">Integrated Toroidal-Syntropic Model / Brendon Boyd</text><text x="64" y="594" fill="#93a9b6" font-family="Arial,sans-serif" font-size="14">itsm-cosmology.com  |  Research proposal; physical viability remains under investigation.</text><g transform="translate(585 20) scale(.93)"><g transform="translate(170 82)" opacity=".10" fill="none" stroke="#80b5c2" stroke-width="1"><polygon points="510.00,382.00 360.00,475.00 360.00,275.00 510.00,182.00"/><polygon points="190.00,393.00 360.00,475.00 360.00,275.00 190.00,193.00"/><polygon points="340.00,100.00 510.00,182.00 360.00,275.00 190.00,193.00"/></g><g transform="translate(-150 93)" opacity=".08" fill="none" stroke="#80b5c2" stroke-width="1"><polygon points="510.00,382.00 360.00,475.00 360.00,275.00 510.00,182.00"/><polygon points="190.00,393.00 360.00,475.00 360.00,275.00 190.00,193.00"/><polygon points="340.00,100.00 510.00,182.00 360.00,275.00 190.00,193.00"/